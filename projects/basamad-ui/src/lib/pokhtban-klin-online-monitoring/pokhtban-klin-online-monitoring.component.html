@if (!transmitters.length) {
  <a
    fd-object-status
    status="negative"
    glyph="error"
    [clickable]="true"
    [large]="true"
    [inverted]="true"
    label="کوره غیر فعال است."
    aria-label="داده‌ای دریافت نشده است."
  ></a>
} @else {
  @if (rokh1OnTop()) {
    <bu-wincc-kiln
      [title]="title"
      [kilnNumber]="kilnNumber"
      [korehId]="korehId"
      [rokhNumber]="1"
      [startsFromRight]="startsFromRight(1)"
      [deviceSize]="deviceSize"
      [mobile]="mobile"
      [transmitters]="transmitters | filter: { RokhNumber: '1' }"
      [ghamirs]="ghamirs | filter: { RokhNumber: '1' }"
    ></bu-wincc-kiln>
    <bu-wincc-kiln
      [title]="title"
      [kilnNumber]="kilnNumber"
      [korehId]="korehId"
      [rokhNumber]="2"
      [startsFromRight]="startsFromRight(2)"
      [deviceSize]="deviceSize"
      [mobile]="mobile"
      [transmitters]="transmitters | filter: { RokhNumber: '2' }"
      [ghamirs]="ghamirs | filter: { RokhNumber: '2' }"
    ></bu-wincc-kiln>
  } @else {
    <bu-wincc-kiln
      [title]="title"
      [kilnNumber]="kilnNumber"
      [korehId]="korehId"
      [rokhNumber]="2"
      [startsFromRight]="startsFromRight(2)"
      [deviceSize]="deviceSize"
      [mobile]="mobile"
      [transmitters]="transmitters | filter: { RokhNumber: '2' }"
      [ghamirs]="ghamirs | filter: { RokhNumber: '2' }"
    ></bu-wincc-kiln>
    <bu-wincc-kiln
      [title]="title"
      [kilnNumber]="kilnNumber"
      [korehId]="korehId"
      [rokhNumber]="1"
      [startsFromRight]="startsFromRight(1)"
      [deviceSize]="deviceSize"
      [mobile]="mobile"
      [transmitters]="transmitters | filter: { RokhNumber: '1' }"
      [ghamirs]="ghamirs | filter: { RokhNumber: '1' }"
    ></bu-wincc-kiln>
  }
}
