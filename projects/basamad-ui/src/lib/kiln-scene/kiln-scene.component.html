<div class="kiln-scene" [class.kiln-scene--zoomed]="isZoomed()">
  <svg
    #svgRef
    class="kiln-scene__svg"
    [attr.viewBox]="viewBoxAttr()"
    [attr.data-detail]="detail()"
    preserveAspectRatio="xMidYMid meet"
    (wheel)="onWheel($event)"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (dblclick)="resetZoom()"
  >
    <defs>
      <filter id="ks-bloom" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="8" />
      </filter>
      <linearGradient id="ks-hall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#131a24" /><stop offset="100%" stop-color="#0a0f16" />
      </linearGradient>
      <linearGradient id="ks-wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a2b22" /><stop offset="55%" stop-color="#2b2018" /><stop offset="100%" stop-color="#1c150f" />
      </linearGradient>
      <pattern id="ks-brick" width="34" height="18" patternUnits="userSpaceOnUse">
        <path d="M0 0H34M0 9H34M0 18H34M17 0V9M0 9V18M34 9V18" stroke="#000" stroke-opacity="0.18" stroke-width="1" />
      </pattern>
      <linearGradient id="ks-pipe" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f6c445" /><stop offset="45%" stop-color="#d99a1c" /><stop offset="100%" stop-color="#8a5e12" />
      </linearGradient>
      <linearGradient id="ks-floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#12161c" /><stop offset="100%" stop-color="#05070a" />
      </linearGradient>
      <linearGradient id="ks-flame" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffe08a" /><stop offset="45%" stop-color="#ff9f0a" /><stop offset="100%" stop-color="#ff3b30" />
      </linearGradient>
      @for (vm of chamberVMs(); track vm.glowId) {
        <radialGradient [attr.id]="vm.glowId" gradientUnits="userSpaceOnUse"
          [attr.cx]="vm.glowCx" [attr.cy]="vm.glowCy" [attr.r]="vm.glowR">
          <stop offset="0%" [attr.stop-color]="vm.color" stop-opacity="1" />
          <stop offset="42%" [attr.stop-color]="vm.color" stop-opacity="0.7" />
          <stop offset="100%" stop-color="#05070a" stop-opacity="0.92" />
        </radialGradient>
      }
    </defs>

    <!-- backdrop -->
    <rect [attr.x]="canvas().x" y="0" [attr.width]="canvas().w" [attr.height]="canvas().h" fill="url(#ks-hall)" />
    <rect [attr.x]="canvas().x" [attr.y]="WALL_TOP" [attr.width]="canvas().w" [attr.height]="chBottom() - WALL_TOP" fill="url(#ks-wall)" />
    <rect [attr.x]="canvas().x" [attr.y]="WALL_TOP" [attr.width]="canvas().w" [attr.height]="chBottom() - WALL_TOP" fill="url(#ks-brick)" />
    <rect [attr.x]="canvas().x" [attr.y]="chBottom()" [attr.width]="canvas().w" [attr.height]="canvas().h - chBottom()" fill="url(#ks-floor)" />

    <!-- chambers -->
    @for (vm of chamberVMs(); track vm.number) {
      <g class="chamber" (click)="onChamberClick(vm)">
        <path [attr.d]="vm.archPath" fill="#07080b" />
        <path [attr.d]="vm.archPath" [attr.fill]="'url(#' + vm.glowId + ')'" filter="url(#ks-bloom)" />
        @for (b of vm.bricks; track $index) {
          <rect [attr.x]="b.x" [attr.y]="b.y" [attr.width]="b.w" [attr.height]="b.h" rx="2"
            [attr.fill]="vm.color" fill-opacity="0.5" stroke="#000" stroke-opacity="0.35" stroke-width="1" />
        }
        <path [attr.d]="vm.archPath" fill="none" stroke="#727c86" stroke-width="3" stroke-opacity="0.85" />
        @if (vm.data.alarm) {
          <path [attr.d]="vm.archPath" fill="none" stroke="#ff453a" stroke-width="4" class="chamber__alarm" />
        }
        <rect [attr.x]="vm.cx - 27" [attr.y]="WALL_TOP + 2" width="54" height="24" rx="5" fill="#0e1319" stroke="#39424c" stroke-width="1.5" />
        <text class="chamber__number" [attr.x]="vm.cx" [attr.y]="WALL_TOP + 19" text-anchor="middle">{{ vm.number }}</text>
        <!-- product name inside the chamber (outlined for readability at any zoom) -->
        <text
          class="chamber__product"
          [class.chamber__product--empty]="vm.isEmpty"
          [attr.x]="vm.cx"
          [attr.y]="vm.productY"
          text-anchor="middle"
        >{{ vm.productText }}</text>
      </g>
    }

    <!-- gas pipe + valves (green = automatic, red = manual/دستی) -->
    <rect [attr.x]="canvas().x + 20" [attr.y]="PIPE_Y - 8" [attr.width]="canvas().w - 40" height="16" rx="8" fill="url(#ks-pipe)" stroke="#5c3f0c" stroke-width="1" />
    @for (vm of nodeVMs(); track vm.i) {
      @if (vm.valveMode) {
        <g class="valve">
          <!-- flame under valve (only zoomed), height ~ open amount -->
          @if (detail() === 'card' && vm.showFlame) {
            <path class="valve__flame" [attr.d]="vm.flamePath" fill="url(#ks-flame)" />
          }
          <!-- valve body: color = RangShir state (no number inside) -->
          <rect [attr.x]="vm.cx - 9" [attr.y]="PIPE_Y - 10" width="18" height="20" rx="3"
            [attr.fill]="vm.valveStateCol" stroke="#0a0f14" stroke-width="1" />
          <!-- handle: green = automatic, red = manual/دستی -->
          <line [attr.x1]="vm.cx" [attr.y1]="PIPE_Y - 10" [attr.x2]="vm.cx" [attr.y2]="PIPE_Y - 20"
            [attr.stroke]="vm.valveMode === 'manual' ? '#ff3b30' : '#34c759'" stroke-width="2" />
          <line [attr.x1]="vm.cx - 7" [attr.y1]="PIPE_Y - 21" [attr.x2]="vm.cx + 7" [attr.y2]="PIPE_Y - 21"
            [attr.stroke]="vm.valveMode === 'manual' ? '#ff3b30' : '#34c759'" stroke-width="2.5" stroke-linecap="round" />
          <!-- valve NUMBER above the valve, readable, plaque bordered by state color -->
          <line [attr.x1]="vm.cx" [attr.y1]="PIPE_Y - 21" [attr.x2]="vm.cx" [attr.y2]="PIPE_Y - 28" stroke="#5a6672" stroke-width="1.4" />
          <rect [attr.x]="vm.cx - 13" [attr.y]="PIPE_Y - 47" width="26" height="19" rx="5"
            fill="#0e1319" [attr.stroke]="vm.valveStateCol" stroke-width="1.6" />
          <text class="valve__num" [attr.x]="vm.cx" [attr.y]="PIPE_Y - 33" text-anchor="middle">{{ vm.valveNumber }}</text>
          <!-- open amount (only zoomed) -->
          @if (detail() === 'card') {
            <text class="valve__open" [attr.x]="vm.cx" [attr.y]="WALL_TOP + 15" text-anchor="middle">{{ vm.valveOpenText }}</text>
          }
        </g>
      }
    }

    <!-- nodes: overview -->
    @if (detail() === 'ov') {
      @for (vm of nodeVMs(); track vm.i) {
        @if (vm.isVirtual) {
          <text class="ov-virt" [attr.x]="vm.cx" [attr.y]="vm.ovTempY" text-anchor="middle" [attr.fill]="vm.color">{{ vm.tempText }}</text>
        } @else {
          <!-- click the number (even un-zoomed) to toggle شماره نود <-> عدد پخت -->
          <text class="ov-num" [class.ov-num--cook]="showsCook(vm.i)" [class.ov-num--clickable]="vm.hasCook"
            [attr.x]="vm.cx" [attr.y]="NCARD_TOP + 40" text-anchor="middle"
            (click)="onNumberClick(vm, $event)">{{ showsCook(vm.i) ? vm.cookText : vm.number }}</text>
          <text class="ov-temp" [attr.x]="vm.cx" [attr.y]="NCARD_TOP + 82" text-anchor="middle" [attr.fill]="vm.color">{{ vm.tempText }}</text>
        }
      }
    } @else {
      <!-- nodes: card mode -->
      @for (vm of nodeVMs(); track vm.i) {
        @if (vm.isVirtual) {
          <!-- virtual node: dim, lightweight, temperature only -->
          <g class="vnode">
            <rect [attr.x]="vm.chipX" [attr.y]="vm.chipY" [attr.width]="VIRT_W" height="42" rx="9"
              fill="#0b0f15" fill-opacity="0.8" stroke="#2a333d" stroke-width="1" stroke-dasharray="3 3" />
            <text class="vnode__temp" [attr.x]="vm.cx" [attr.y]="vm.chipY + 20" text-anchor="middle" [attr.fill]="vm.color">{{ vm.tempText }}</text>
            <text class="vnode__tag" [attr.x]="vm.cx" [attr.y]="vm.chipY + 34" text-anchor="middle">مجازی</text>
          </g>
        } @else {
          <g class="node" [class.node--failed]="vm.failed">
            <line [attr.x1]="vm.cx" [attr.y1]="vm.connY" [attr.x2]="vm.cx" [attr.y2]="PIPE_Y" stroke="#63707c" stroke-width="1.5" />
            <circle [attr.cx]="vm.cx" [attr.cy]="vm.connY" r="3" fill="#aeb9c2" />
            <rect [attr.x]="vm.cardX" [attr.y]="vm.cardY" [attr.width]="REAL_CARD_W" [attr.height]="CARD_H" rx="11"
              fill="#0d131b" fill-opacity="0.96" stroke="#2b333d" stroke-width="1.5" />
            <path [attr.d]="vm.stripPath" [attr.fill]="vm.color" />

            <!-- click the number to toggle شماره نود <-> عدد پخت -->
            <text class="card__id" [class.card__id--cook]="showsCook(vm.i)" [class.card__id--clickable]="vm.hasCook"
              [attr.x]="vm.cardX + REAL_CARD_W - 10" [attr.y]="vm.cardY + 30" text-anchor="end"
              (click)="onNumberClick(vm, $event)">{{ showsCook(vm.i) ? vm.cookText : vm.number }}</text>
            <text class="card__idlabel" [attr.x]="vm.cardX + REAL_CARD_W - 10" [attr.y]="vm.cardY + 45" text-anchor="end">{{ showsCook(vm.i) ? 'عدد پخت' : (vm.hasCook ? 'نود ⇄ پخت' : 'شماره نود') }}</text>

            @if (vm.battShow) {
              <rect [attr.x]="vm.cardX + 9" [attr.y]="vm.cardY + 15" width="20" height="11" rx="2" fill="none" stroke="#7d8894" stroke-width="1.3" />
              <rect [attr.x]="vm.cardX + 29" [attr.y]="vm.cardY + 18" width="2.4" height="5" fill="#7d8894" />
              <rect [attr.x]="vm.cardX + 11" [attr.y]="vm.cardY + 17" [attr.width]="vm.battW" height="7" rx="1" [attr.fill]="vm.battFill" />
            }
            @if (vm.failed) {
              <circle [attr.cx]="vm.cardX + 16" [attr.cy]="vm.cardY + 35" r="4" fill="#ff9f0a" />
            }

            <line [attr.x1]="vm.cardX + 10" [attr.y1]="vm.cardY + 58" [attr.x2]="vm.cardX + REAL_CARD_W - 10" [attr.y2]="vm.cardY + 58" stroke="#222a33" stroke-width="1" />
            <text class="card__label" [attr.x]="vm.cardX + REAL_CARD_W - 10" [attr.y]="vm.cardY + 82" text-anchor="end">دما</text>
            <text class="card__temp" [attr.x]="vm.cardX + 10" [attr.y]="vm.cardY + 83" text-anchor="start" [attr.fill]="vm.color">{{ vm.tempText }}</text>
          </g>
        }
      }
    }
  </svg>

  @if (zoomable) {
    <div class="kiln-scene__zoom">
      <button type="button" (click)="zoomBy(0.8)" aria-label="بزرگ‌نمایی">+</button>
      <button type="button" (click)="zoomBy(1.25)" aria-label="کوچک‌نمایی">−</button>
      @if (isZoomed()) {
        <button type="button" class="reset" (click)="resetZoom()" aria-label="بازنشانی">⟲</button>
      }
    </div>
  }
</div>
